<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Global Port Reach</title>
<script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
<style>
:root{--navy:#04192D;--ink:#07111f;--cyan:#35e4ff;--red:#ff5b69;--amber:#ffd166;--muted:#91a9c2;--line:rgba(145,185,218,.2)}
*{box-sizing:border-box}body{margin:0;background:var(--navy);color:#eef7ff;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
#port-reach{min-height:100vh;padding:clamp(20px,4vw,54px);background:radial-gradient(circle at 60% 44%,rgba(23,77,116,.32),transparent 44%),var(--navy)}
header{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:24px}.kicker{margin:0 0 9px;color:var(--cyan);font-size:11px;font-weight:700;letter-spacing:.17em;text-transform:uppercase}h1{margin:0;font-size:clamp(28px,4vw,54px);letter-spacing:-.055em;line-height:.98}.intro{max-width:310px;margin:0;color:var(--muted);font-size:13px;line-height:1.5}
.chart-wrap{position:relative;min-height:620px;border:1px solid rgba(133,190,230,.2);background:rgba(5,22,43,.54);overflow:hidden}.chart-wrap::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(90deg,transparent 49.9%,rgba(55,228,255,.025) 50%,transparent 50.1%)}
svg{width:100%;height:clamp(570px,70vh,760px);display:block;position:relative;z-index:1}.grid line{stroke:var(--line);stroke-dasharray:3 7}.grid path,.axis path{display:none}.axis text{fill:#a9bfd5;font-size:11px}.axis .domain{stroke:var(--line)}.axis line{stroke:var(--line)}
.axis-title{fill:#88a5c0;font-size:11px;letter-spacing:.08em;text-transform:uppercase}.bubble{cursor:pointer;transition:opacity .18s}.bubble circle{stroke-width:1.6}.bubble text{fill:#f3fbff;font-size:11px;font-weight:650;pointer-events:none;text-anchor:middle}.bubble .rank{fill:#07111f;font-size:10px;font-weight:800}.bubble:hover circle,.bubble.focus circle{stroke:#fff;stroke-width:2.4;filter:drop-shadow(0 0 12px currentColor)}
#tip{position:fixed;z-index:4;display:none;pointer-events:none;max-width:290px;background:#eaf7ff;color:#061526;padding:12px 14px;box-shadow:0 14px 36px rgba(0,0,0,.4);font-size:12px;line-height:1.45}#tip strong{display:block;font-size:15px;margin-bottom:3px}#tip span{color:#38516d}.key{position:absolute;bottom:16px;left:18px;z-index:2;display:flex;gap:15px;color:#a9bfd5;font-size:11px}.key b{font-weight:500;color:#fff}.key i{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--amber);margin-right:5px}
@media(max-width:650px){#port-reach{padding:20px 13px}header{align-items:flex-start;flex-direction:column;margin-bottom:18px}.chart-wrap{min-height:530px}svg{height:560px}.bubble text{font-size:9px}.key{right:12px;flex-wrap:wrap}}
</style>
</head>
<body>
<main id="port-reach">
<header><div><p class="kicker">Overseas port ownership network</p><h1>Scale meets reach.</h1></div><p class="intro">A bubble field comparing the number of ports owned with the number of host countries reached.</p></header>
<section class="chart-wrap" aria-label="Interactive bubble chart showing global overseas port reach">
<svg id="chart" role="img" aria-label="Each bubble represents an owner country or region. Horizontal position is overseas ports. Vertical position is host countries reached. Bubble size indicates share of global overseas ports."></svg>
<div class="key"><span><i></i><b>Bubble size</b> = global port share</span><span><b>Position</b> = scale and geographic reach</span></div>
</section>
</main>
<div id="tip"></div>
<script>
const data=[
{rank:1,name:"Denmark / Netherlands",ports:39,hosts:28,share:16.5,entity:"APM Terminals (Maersk)"},
{rank:2,name:"United Arab Emirates",ports:37,hosts:26,share:15.7,entity:"DP World / AD Ports Group"},
{rank:3,name:"Singapore",ports:31,hosts:18,share:13.1,entity:"PSA International"},
{rank:4,name:"Hong Kong",ports:29,hosts:21,share:12.3,entity:"Hutchison Ports (CK Hutchison)"},
{rank:5,name:"Philippines",ports:23,hosts:19,share:9.7,entity:"International Container Terminal Services (ICTSI)"},
{rank:6,name:"France",ports:22,hosts:19,share:9.3,entity:"CMA CGM / Terminal Link / CMA Terminals"},
{rank:7,name:"China",ports:16,hosts:13,share:6.8,entity:"COSCO Shipping Ports / China Merchants / SIPG / COPHC / CHEC"},
{rank:8,name:"Switzerland / Italy",ports:13,hosts:11,share:5.5,entity:"Terminal Investment Limited (TiL / MSC)"},
{rank:9,name:"India",ports:10,hosts:7,share:4.2,entity:"Adani Ports and Special Economic Zone"},
{rank:10,name:"Japan",ports:7,hosts:6,share:3,entity:"Major Japanese Shipping Consortiums (ONE / NYK / Mitsui)"},
{rank:11,name:"South Korea",ports:5,hosts:3,share:2.1,entity:"HMM / State Shipping Consortiums"},
{rank:12,name:"Taiwan",ports:4,hosts:2,share:1.7,entity:"Evergreen Marine / Yang Ming"}];
const svg=d3.select("#chart"), tip=document.querySelector("#tip");
const colors=d3.scaleLinear().domain([1,6,12]).range(["#ff5b69","#35e4ff","#ffd166"]).interpolate(d3.interpolateRgb);
function tooltip(e,d){tip.innerHTML="<strong>"+d.name+"</strong><span>Rank #"+d.rank+" · "+d.share.toFixed(1)+"% of global overseas ports</span><br><b>"+d.ports+"</b> overseas ports · <b>"+d.hosts+"</b> host countries<br><span>"+d.entity+"</span>";tip.style.display="block";tip.style.left=Math.min(e.clientX+16,innerWidth-305)+"px";tip.style.top=Math.min(e.clientY+16,innerHeight-150)+"px"}
function render(){
 const box=svg.node().getBoundingClientRect(), w=box.width,h=box.height,m={top:48,right:44,bottom:70,left:64};
 svg.attr("viewBox","0 0 "+w+" "+h).selectAll("*").remove();
 const x=d3.scaleLinear().domain([0,42]).range([m.left,w-m.right]), y=d3.scaleLinear().domain([0,31]).range([h-m.bottom,m.top]), r=d3.scaleSqrt().domain(d3.extent(data,d=>d.share)).range([17,52]);
 const gridX=d3.axisBottom(x).ticks(7).tickSize(-(h-m.top-m.bottom)).tickFormat(""),gridY=d3.axisLeft(y).ticks(6).tickSize(-(w-m.left-m.right)).tickFormat("");
 svg.append("g").attr("class","grid").attr("transform","translate(0,"+(h-m.bottom)+")").call(gridX);
 svg.append("g").attr("class","grid").attr("transform","translate("+m.left+",0)").call(gridY);
 svg.append("g").attr("class","axis").attr("transform","translate(0,"+(h-m.bottom)+")").call(d3.axisBottom(x).ticks(7));
 svg.append("g").attr("class","axis").attr("transform","translate("+m.left+",0)").call(d3.axisLeft(y).ticks(6));
 svg.append("text").attr("class","axis-title").attr("x",(w+m.left-m.right)/2).attr("y",h-21).attr("text-anchor","middle").text("Overseas ports owned / operated");
 svg.append("text").attr("class","axis-title").attr("transform","translate(19,"+((h-m.top-m.bottom)/2+m.top)+") rotate(-90)").attr("text-anchor","middle").text("Hosting countries reached");
 const bubbles=svg.append("g").selectAll("g").data(data).join("g").attr("class","bubble").attr("transform",d=>"translate("+x(d.ports)+","+y(d.hosts)+")").on("mousemove",(e,d)=>{bubbles.style("opacity",p=>p===d?1:.22);d3.select(e.currentTarget).classed("focus",true);tooltip(e,d)}).on("mouseleave",e=>{bubbles.style("opacity",1);d3.select(e.currentTarget).classed("focus",false);tip.style.display="none"});
 bubbles.append("circle").attr("r",d=>r(d.share)).attr("fill",d=>colors(d.rank)).attr("fill-opacity",.88).attr("stroke",d=>colors(d.rank));
 bubbles.append("text").attr("class","rank").attr("y",-4).text(d=>"#"+d.rank);
 bubbles.append("text").attr("y",11).text(d=>d.name.length>17?d.name.replace(" / "," /\n"):d.name).each(function(d){const text=d3.select(this),parts=text.text().split("\n");text.text(null);parts.forEach((part,i)=>text.append("tspan").attr("x",0).attr("dy",i?11:0).text(part))});
}
render();new ResizeObserver(render).observe(svg.node());
</script>
</body>
</html>
