<html lang="en">

<title>Overseas Port Ownership</title>

<style>

  .page{min-height:100vh; padding:clamp(16px,3vw,40px); display:flex; flex-direction:column; gap:18px}
  header{display:flex; justify-content:space-between; gap:16px; align-items:flex-end} h1{font-size:clamp(25px,3.4vw,46px); line-height:1; margin:0; letter-spacing:-.05em} .eyebrow{color:var(--cyan); font-weight:700; font-size:11px; letter-spacing:.16em; text-transform:uppercase; margin:0 0 9px}.instruction{margin:0; max-width:340px; color:var(--muted); font-size:13px; line-height:1.45}
  .layout{flex:1; min-height:600px; display:grid; grid-template-columns:minmax(0,1fr) 300px; gap:16px}.map-card,.side{border:1px solid rgba(150,190,225,.16); background:rgba(8,21,37,.83); box-shadow:0 24px 70px rgba(0,0,0,.25)}.map-card{position:relative; overflow:hidden; min-height:600px}.map-card::before{content:""; position:absolute; inset:0; pointer-events:none; opacity:.35; background-image:linear-gradient(rgba(124,162,197,.12) 1px,transparent 1px),linear-gradient(90deg,rgba(124,162,197,.12) 1px,transparent 1px); background-size:45px 45px} svg{display:block; position:relative; width:100%; height:100%; min-height:600px}.country{fill:var(--land); stroke:var(--border); stroke-width:.55px; transition:fill .15s}.country.owner{cursor:pointer; fill:#38516d}.country.owner:hover,.country.selected{fill:#597d9e}.connection{fill:none; stroke:var(--cyan); stroke-width:1.3; stroke-linecap:round; stroke-dasharray:2 7; filter:drop-shadow(0 0 4px rgba(53,228,255,.75)); animation:fly 1.2s linear infinite}.port-dot{fill:var(--gold); stroke:#fff6ce; stroke-width:.6; filter:drop-shadow(0 0 5px rgba(255,209,102,.8))}.origin-dot{fill:var(--cyan); stroke:#d8fbff; stroke-width:1; filter:drop-shadow(0 0 8px var(--cyan))}@keyframes fly{to{stroke-dashoffset:-18}}
  .legend{position:absolute; left:18px; bottom:15px; color:#b5c5d7; display:flex; gap:13px; align-items:center; font-size:11px; z-index:2}.key{display:inline-flex; align-items:center; gap:5px}.key i{width:9px;height:9px;border-radius:50%;background:var(--gold);box-shadow:0 0 6px var(--gold)}.key i.line{height:2px;width:18px;border-radius:0;background:var(--cyan)}
  .side{padding:20px; display:flex; flex-direction:column}.stats{display:grid; grid-template-columns:1fr 1fr; gap:8px; margin:17px 0}.stat{padding:12px;background:rgba(76,113,147,.15);border:1px solid rgba(170,203,234,.1)}.stat b{display:block;font-size:23px;letter-spacing:-.05em}.stat span{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.09em}.country-list{overflow:auto; padding-right:5px}.owner-row{border-top:1px solid rgba(166,200,230,.12); padding:11px 2px; cursor:pointer; display:flex;justify-content:space-between;gap:8px;color:#dce9f5;font-size:13px}.owner-row:hover,.owner-row.active{color:var(--cyan)}.owner-row em{font-style:normal;color:var(--muted);font-size:11px}.detail{margin-top:auto; border-top:1px solid rgba(166,200,230,.15); padding-top:15px;min-height:118px}.detail h2{font-size:17px;margin:0 0 4px}.detail p{margin:0;color:var(--muted);font-size:12px;line-height:1.5}.tip{position:fixed; display:none; z-index:5;pointer-events:none; background:#eaf7ff; color:#08121d; padding:9px 10px; font-size:12px; line-height:1.35; max-width:225px; box-shadow:0 10px 25px #0006}.tip strong{display:block}
  @media(max-width:800px){.layout{grid-template-columns:1fr;}.side{min-height:330px}.map-card,svg{min-height:500px}header{align-items:flex-start;flex-direction:column}.country-list{max-height:190px}}
  /* Active-country / route treatment inspired by the supplied reference. */
  .country.selected{fill:#bd1c2b!important;stroke:#ff8b94;stroke-width:1.1px;filter:drop-shadow(0 0 7px rgba(255,63,78,.48))}
  .connection{stroke:#ff5b69!important;stroke-width:1.45px!important;filter:drop-shadow(0 0 4px rgba(255,91,105,.7))!important}
  .port-label{font-size:8px;font-weight:700;letter-spacing:.025em;fill:#73f4ff;paint-order:stroke;stroke:#061526;stroke-width:3px;stroke-linejoin:round;pointer-events:none;text-transform:uppercase}
  .page{padding:0}.layout{min-height:100vh;display:block}.map-card{min-height:100vh;border:0}.map-card,svg{min-height:100vh}.legend{opacity:.72}
  body,.map-card{background:#04192D}.map-card::before{background-image:none}
</style>
</head>

</main>

const alias = {"Viet Nam":"Vietnam","Côte d'Ivoire":"Ivory Coast","Cote D'Ivoire":"Ivory Coast","Türkiye":"Turkey","South Korea":"South Korea","United States":"United States","United Kingdom":"United Kingdom","Democratic Republic of the Congo":"Democratic Republic of the Congo"};
const ownerCoords = {"China":[104,35],"United Arab Emirates":[54,24],"Singapore":[103.8,1.35],"Hong Kong":[114.17,22.3],"Denmark / Netherlands":[8.5,55.7],"Philippines":[122,12.8],"France":[2.2,46.2],"Switzerland / Italy":[9.7,46.8],"Taiwan":[121,23.7],"South Korea":[127.8,36.2],"India":[78.9,21.1],"Japan":[138,36.2]};
const seen = new Set();
const rows = d3.csvParse(csvText).map(d => ({owner:d["Owner (Country)"].trim(), port:d["Port Name"].trim(), host:d["Hosting Country"].trim()})).filter(d => { const key=d.owner+"|"+d.port+"|"+d.host; if(seen.has(key)) return false; seen.add(key); return true; });
const grouped = d3.group(rows, d => d.owner);
const owners = [...grouped.keys()].filter(d=>ownerCoords[d]).sort((a,b)=>grouped.get(b).length-grouped.get(a).length);
const svg=d3.select("#map"), layer=svg.append("g"), routes=svg.append("g"), points=svg.append("g");
const tip=document.querySelector("#tip");
let projection, path, features=[], selected=null;
function canonical(n){return alias[n]||n}
// The boundary provider uses `name`; older versions used `ADMIN`.
// Keeping both prevents the tooltip and owner lookup from becoming undefined.
function featureName(feature){return feature?.properties?.name || feature?.properties?.ADMIN || feature?.properties?.NAME || "Unknown country"}
function showTip(event, title, text){tip.innerHTML="<strong>"+title+"</strong>"+text; tip.style.display="block"; tip.style.left=Math.min(event.clientX+15,innerWidth-238)+"px";tip.style.top=Math.min(event.clientY+15,innerHeight-95)+"px"}
function hideTip(){tip.style.display="none"}
function drawRoutes(owner){
  selected=owner; d3.selectAll(".country").classed("selected",d=>canonical(featureName(d))===owner);
  routes.selectAll("*").remove(); points.selectAll("*").remove();
  const origin=projection(ownerCoords[owner]); if(!origin)return;
  points.append("circle").attr("class","origin-dot").attr("cx",origin[0]).attr("cy",origin[1]).attr("r",5);
  const records=grouped.get(owner), usedByHost=d3.group(records,d=>canonical(d.host));
  records.forEach((record,index)=>{
    const f=features.find(x=>canonical(featureName(x))===canonical(record.host)); if(!f)return;
    const center=path.centroid(f); if(!Number.isFinite(center[0]))return;
    const siblings=usedByHost.get(canonical(record.host)), siblingIndex=siblings.indexOf(record), angle=(siblingIndex*2.399)+index*.19;
    const spread=Math.min(20, 5+siblings.length*1.65), end=[center[0]+Math.cos(angle)*spread,center[1]+Math.sin(angle)*spread*.54];
    const mid=[(origin[0]+end[0])/2,(origin[1]+end[1])/2-28-Math.min(75,Math.abs(origin[0]-end[0])*.075)];
    routes.append("path").attr("class","connection").attr("d","M"+origin+" Q"+mid+" "+end);
    const mark=points.append("g").attr("transform","translate("+end+")");
    mark.append("circle").attr("class","port-dot").attr("r",3.2);
    mark.append("text").attr("class","port-label").attr("x",6).attr("y",-5).text(record.port.length>27?record.port.slice(0,26)+"…":record.port);
    mark.on("mousemove",e=>showTip(e,record.port,record.host)).on("mouseleave",hideTip);
  });
}
function clearRoutes(){selected=null;routes.selectAll("*").remove();points.selectAll("*").remove();d3.selectAll(".country").classed("selected",false);hideTip()}
function resize(){const box=svg.node().getBoundingClientRect();svg.attr("viewBox","0 0 "+box.width+" "+box.height);projection=d3.geoNaturalEarth1().fitSize([box.width,box.height],{type:"FeatureCollection",features});path=d3.geoPath(projection);layer.selectAll("path").attr("d",path);if(selected)drawRoutes(selected)}
d3.json("https://cdn.jsdelivr.net/gh/datasets/geo-countries@master/data/countries.geojson").then(world=>{
 features=world.features; layer.selectAll("path").data(features).join("path").attr("class",d=>"country "+(owners.includes(canonical(featureName(d)))?"owner":"")).attr("d",d3.geoPath(d3.geoNaturalEarth1().fitSize([svg.node().getBoundingClientRect().width,svg.node().getBoundingClientRect().height],world))).on("mouseenter",(e,d)=>{const owner=canonical(featureName(d));if(owners.includes(owner))drawRoutes(owner);else clearRoutes()}).on("mouseleave",clearRoutes);
 resize(); new ResizeObserver(resize).observe(svg.node()); window.addEventListener("keydown",e=>{if(e.key==="Escape")clearRoutes()});
}).catch(()=>{showTip({clientX:18,clientY:18},"Map data unavailable","Connect to the internet and reload.")});
