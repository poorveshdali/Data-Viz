<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Global Port Ownership Treemap</title>
<script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
<style>
:root{--navy:#04192D;--cyan:#35e4ff;--red:#ff5b69;--amber:#ffd166;--text:#eef7ff;--muted:#a7bad0}
*{box-sizing:border-box}body{margin:0;background:var(--navy);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
#treemap-page{min-height:100vh;padding:clamp(20px,4vw,54px);background:radial-gradient(circle at 66% 35%,rgba(34,105,144,.25),transparent 40%),var(--navy)}
header{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:25px}.eyebrow{margin:0 0 8px;color:var(--cyan);font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase}h1{margin:0;font-size:clamp(28px,4.3vw,55px);line-height:1;letter-spacing:-.055em}.sub{max-width:300px;margin:0;color:var(--muted);font-size:13px;line-height:1.5}
#treemap{height:min(74vh,780px);min-height:560px;border:1px solid rgba(133,190,230,.18);background:rgba(5,22,43,.48);position:relative;overflow:hidden}svg{width:100%;height:100%;display:block}.tile{cursor:pointer}.tile rect{stroke:#04192D;stroke-width:3px;transition:filter .2s,opacity .2s}.tile:hover rect,.tile.focus rect{stroke:#fff;stroke-width:2px;filter:brightness(1.2) drop-shadow(0 0 13px rgba(53,228,255,.42))}.tile text{pointer-events:none;fill:#eff9ff;text-shadow:0 1px 8px #04192d;font-weight:600}.tile .share{fill:#fff;font-size:clamp(16px,2vw,28px)}.tile .name{font-size:clamp(11px,1.3vw,17px)}.tile .meta{fill:#c4d4e5;font-size:11px;font-weight:500}.caption{position:absolute;left:16px;bottom:14px;color:#a8bed4;font-size:11px;z-index:2}.caption i{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--amber);margin:0 5px 0 12px}.caption i:first-child{margin-left:0;background:var(--cyan)}
#tip{display:none;position:fixed;z-index:3;pointer-events:none;max-width:300px;background:#edf8ff;color:#071a2e;padding:13px 14px;box-shadow:0 14px 38px rgba(0,0,0,.42);font-size:12px;line-height:1.5}#tip strong{display:block;font-size:15px}#tip span{color:#3f5973}
@media(max-width:640px){#treemap-page{padding:20px 13px}header{align-items:start;flex-direction:column;margin-bottom:18px}#treemap{min-height:580px}.tile .meta{display:none}}
</style>
</head>
<body>
<main id="treemap-page">
<header><div><p class="eyebrow">Global overseas port ownership</p><h1>Who holds the network?</h1></div><p class="sub">Each tile is an owner. Its area is proportional to its share of all overseas ports in the dataset.</p></header>
<section id="treemap" aria-label="Treemap of global overseas port ownership"><svg id="chart" role="img" aria-label="Interactive treemap of overseas ports owned or operated by country and region"></svg><div class="caption"><i></i> tile area = global port share <i></i> color = rank progression</div></section>
</main>
<div id="tip"></div>
<script>
const data=[
["Denmark / Netherlands",39,28,16.5,"APM Terminals (Maersk)"],["United Arab Emirates",37,26,15.7,"DP World / AD Ports Group"],["Singapore",31,18,13.1,"PSA International"],["Hong Kong",29,21,12.3,"Hutchison Ports (CK Hutchison)"],["Philippines",23,19,9.7,"International Container Terminal Services (ICTSI)"],["France",22,19,9.3,"CMA CGM / Terminal Link / CMA Terminals"],["China",16,13,6.8,"COSCO Shipping Ports / China Merchants / SIPG / COPHC / CHEC"],["Switzerland / Italy",13,11,5.5,"Terminal Investment Limited (TiL / MSC)"],["India",10,7,4.2,"Adani Ports and Special Economic Zone"],["Japan",7,6,3,"Major Japanese Shipping Consortiums (ONE / NYK / Mitsui)"],["South Korea",5,3,2.1,"HMM / State Shipping Consortiums"],["Taiwan",4,2,1.7,"Evergreen Marine / Yang Ming"]
].map((d,i)=>({name:d[0],ports:d[1],hosts:d[2],share:d[3],entity:d[4],rank:i+1}));
const svg=d3.select("#chart"),tip=document.querySelector("#tip"), color=d3.scaleLinear().domain([1,6,12]).range(["#ff5b69","#35e4ff","#ffd166"]).interpolate(d3.interpolateRgb);
function showTip(e,d){tip.innerHTML="<strong>"+d.name+"</strong><span>Rank #"+d.rank+" · "+d.share.toFixed(1)+"% of global share</span><br><b>"+d.ports+"</b> overseas ports · <b>"+d.hosts+"</b> host countries<br><span>"+d.entity+"</span>";tip.style.display="block";tip.style.left=Math.min(e.clientX+16,innerWidth-315)+"px";tip.style.top=Math.min(e.clientY+16,innerHeight-150)+"px"}
function render(){const box=svg.node().getBoundingClientRect(),w=box.width,h=box.height;svg.attr("viewBox","0 0 "+w+" "+h).selectAll("*").remove();const root=d3.hierarchy({children:data}).sum(d=>d.share).sort((a,b)=>b.value-a.value);d3.treemap().size([w,h]).paddingInner(4).paddingOuter(5).round(true)(root);const nodes=svg.selectAll(".tile").data(root.leaves()).join("g").attr("class","tile").attr("transform",d=>"translate("+d.x0+","+d.y0+")").on("mousemove",(e,d)=>{nodes.style("opacity",n=>n===d?1:.3);d3.select(e.currentTarget).classed("focus",true);showTip(e,d.data)}).on("mouseleave",e=>{nodes.style("opacity",1);d3.select(e.currentTarget).classed("focus",false);tip.style.display="none"});nodes.append("rect").attr("width",d=>d.x1-d.x0).attr("height",d=>d.y1-d.y0).attr("fill",d=>color(d.data.rank));nodes.each(function(d){const g=d3.select(this),width=d.x1-d.x0,height=d.y1-d.y0,cx=width/2;if(width<84||height<64)return;g.append("text").attr("class","share").attr("x",cx).attr("y",height/2-9).attr("text-anchor","middle").text(d.data.share.toFixed(1)+"%");g.append("text").attr("class","name").attr("x",cx).attr("y",height/2+12).attr("text-anchor","middle").text(d.data.name);if(height>112)g.append("text").attr("class","meta").attr("x",cx).attr("y",height/2+31).attr("text-anchor","middle").text(d.data.ports+" ports · "+d.data.hosts+" countries")})}
render();new ResizeObserver(render).observe(svg.node());
</script>
</body>
</html>
