name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: "New Make Data Visualization Interactive"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build
        env:
          FIGMA_PUBLIC_URL: "/Data-Viz/New Make Data Visualization Interactive"
        run: npm run build

      - name: Stage site under project path
        run: |
          rm -rf "${RUNNER_TEMP}/pages"
          mkdir -p "${RUNNER_TEMP}/pages/New Make Data Visualization Interactive"
          cp -R dist/. "${RUNNER_TEMP}/pages/New Make Data Visualization Interactive/"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: "${{ runner.temp }}/pages"

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
